services:
  mongo: 
    image: mongo
    ports:
      - 27017:27017
    volumes:
      - todo_data:/data/db
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/todo-app
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 5173:5173
    environment:
      - VITE_API_BASE_URL=http://localhost:3000/api/v1

volumes:
  todo_data: